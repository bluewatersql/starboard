[project]
name = "starboard-skills"
version = "0.1.0"
description = "Starboard Claude skills and Databricks helper scripts"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.60.0",
]

[project.scripts]
starboard-helper = "starboard_skills.helpers.__main__:main"
starboard-maint = "starboard_skills.maint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starboard_skills"]

# Vendor the canonical skill tree into the wheel (built, not hand-copied).
# This is the single source of truth for SKILL.md files (Phase 0 A2 / D-0.1).
[tool.hatch.build.targets.wheel.force-include]
"skills" = "starboard_skills/skills"

[tool.hatch.build.targets.sdist]
include = [
    "starboard_skills/**/*.py",
    "skills/**/*.md",
    "pyproject.toml",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, isolated)",
]
asyncio_mode = "auto"
