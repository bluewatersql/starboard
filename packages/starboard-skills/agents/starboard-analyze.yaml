name: starboard-analyze
description: >-
  Orchestrate a comprehensive, cross-domain Databricks workload analysis — route to the
  appropriate per-domain subagent or run a full multi-domain review. Use when the user asks
  for an overall workload review, a health and cost assessment spanning multiple domains, or
  when the domain is unclear and needs routing.
