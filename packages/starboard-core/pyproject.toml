[project]
# Distribution name renamed starboard-core -> starboard-kernel (Phase-1 X3 / D-1.2).
# The IMPORT package is unchanged: `import starboard_core` (and `starboard_x`) still
# work — only the published wheel name changed. `starboard-core` stays installable as
# a thin one-release deprecation alias (packages/starboard-core-alias) that depends on
# starboard-kernel, so existing `pip install starboard-core` keeps resolving.
name = "starboard-kernel"
version = "0.1.1"
description = "Starboard AI Agent - Core domain models, prompts, and shared types (kernel tier)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Databricks Open Model License"}
dependencies = [
    "pydantic>=2.12.3",
    "orjson>=3.11.4",
    "stream-unzip>=0.0.94",
    "numpy>=2.0.0,<3.0.0",
    "polars>=1.17.0,<2.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# DBFS / Unity Catalog Volumes log loader (Databricks SDK).
# Kept OUT of the hard dependencies so the pure kernel + log-parser surface
# imports without databricks-sdk (Phase-1 B1). The dbfs loader lazily imports
# the SDK and raises an actionable error when this extra is absent.
databricks = [
    "databricks-sdk>=0.73.0,<1.0.0",
]

# =============================================================================
# starboard_x per-capability extras (Phase-1 D-1.3)
# =============================================================================
# The middle tier (`python -m starboard_x.<domain>`) is lighter than the server:
# base install is pydantic-only; each skill installs only its extra. Phase-1
# shipped the diagnostics* extras; Phase-2 D4 fills in discovery / sparklog* /
# warehouse / uc with their real dep sets (progressive_helpers/technical.md §4).
#
# --- diagnostics -------------------------------------------------------------
diagnostics-core = []                       # stdlib-only trio (C1,C2,C6)
diagnostics = ["pyyaml>=6.0.3"]             # + pattern registry (C5)
# --- discovery (Phase-2 D4) --------------------------------------------------
discovery = [
    "polars>=1.17.0,<2.0.0",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.73.0,<1.0.0",
]
# --- spark log parser (Phase-2 D4) -------------------------------------------
sparklog = [
    "polars>=1.17.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "stream-unzip>=0.0.94",
    "httpx>=0.28.1",
]
sparklog-aws = ["starboard-kernel[sparklog]", "boto3>=1.34.0"]
sparklog-azure = [
    "starboard-kernel[sparklog]",
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.15.0",
]
sparklog-gcp = ["starboard-kernel[sparklog]", "google-cloud-storage>=2.14.0"]
# --- warehouse / uc / cluster (Phase-2 D4; analyzers are pure/SDK-free) -------
warehouse = [
    "polars>=1.17.0,<2.0.0",
    "sqlglot>=27.29.0,<28.0.0",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.73.0,<1.0.0",
]
uc = [
    "databricks-sdk>=0.73.0,<1.0.0",
    "databricks-sql-connector>=3.0.0",
]
cluster = ["databricks-sdk>=0.73.0,<1.0.0"]
# --- charts (heavy binary dep, isolated; still a stub until it ships) ---------
charts = [
    "polars>=1.17.0,<2.0.0",
]
all = [
    "starboard-kernel[diagnostics,discovery,sparklog,warehouse,uc,cluster,charts]"
]

# AWS S3 support
aws = [
    "boto3>=1.34.0",
]

# Azure ADLS support
azure = [
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.15.0",
]

# GCP GCS support
gcp = [
    "google-cloud-storage>=2.14.0",
]

test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "syrupy>=4.6.0",
]

# Console-script alias for the middle-tier CLI namespace (Phase-1 B2). Mirrors
# `python -m starboard_x.<domain>`; dispatches to the capability sub-modules.
[project.scripts]
starboard-x = "starboard_x.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NB: the hatchling config table is `[tool.hatch...]` (not `[tool.hatchling...]`).
# With the distribution renamed to `starboard-kernel`, hatchling's default
# name->directory heuristic (which used to auto-pick `starboard_core`) no longer
# matches, so the wheel MUST enumerate its import packages explicitly here. Both
# `starboard_core` (kernel) and `starboard_x` (capability helpers) ship in this wheel.
[tool.hatch.build.targets.wheel]
packages = ["starboard_core", "starboard_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=starboard_core",
    "--cov-report=term-missing",
]
markers = [
    "unit: Unit tests (fast, isolated)",
]
asyncio_mode = "auto"

